<!DOCTYPE html>
<html lang="sk">
<head>
    <title>SPEN2 Košútka 2024</title>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="referrer" content="no-referrer"/>
    <link rel='stylesheet' href='assets/photoswipe/photoswipe.css' type='text/css'/>
    <link rel='stylesheet' href='assets/site.css' type='text/css'/>
    <style>
        body.race-hero { --hero-pos: 50% 50%; }
        @media (max-width: 520px) { body.race-hero { --hero-pos: 50% 50%; } }
    </style>
</head>
<body class="race-hero">
<header class="hero">
  <img class="hero-bg" src="data/2024/SPEN2_Kosutka/spen2_propozicie1.jpeg" alt="">
  <div class="hero-inner">
    <div class="wrap">
      <span class="kicker"><span class="dot"></span>Slovenský pohár v endure · 2. kolo</span>
      <h1>Košútka<br>2024</h1>
      <div class="meta">Košútka · 7. júla 2024 · Enduro Challenge</div>
      <div class="badges">
        <span class="badge series">SPEN2</span>
        <span class="badge">Vynechané (dovolenka)</span>
      </div>
    </div>
  </div>
</header>

<main>
<section class="wrap report-narrative">
  <div class="grid2">
    <div class="prose">
      <p><span class="highlight">7.7.2024</span> Vynechané pre dovolenku.</p>
    </div>
    <aside>
      <div class="card" id="map-gallery">
        <h3>Mapa trate</h3>
        <img src="data/2024/SPEN2_Kosutka/spen2_mapa.jpeg" alt="Mapa Košútka">
      </div>
    </aside>
  </div>
</section>

<section class="wrap">
  <div class="eyebrow">Propozície</div>
  <h2>Propozície preteku</h2>
  <div id="gallery" class="gallery">
                    <img src="data/2024/SPEN2_Kosutka/spen2_propozicie1.jpeg" alt="SPEN2 Košútka">
                    <img src="data/2024/SPEN2_Kosutka/spen2_propozicie2.jpeg" alt="SPEN2 Košútka">
                    <img src="data/2024/SPEN2_Kosutka/spen2_propozicie3.jpeg" alt="SPEN2 Košútka">
                    <img src="data/2024/SPEN2_Kosutka/spen2_propozicie4.jpeg" alt="SPEN2 Košútka">
  </div>
</section>
</main>

<footer class="race-footer">SPEN2 Košútka 2024</footer>

<script type="module">
    import PhotoSwipeLightbox from './assets/photoswipe/photoswipe-lightbox.esm.min.js';

    const pswpModule = () => import('./assets/photoswipe/photoswipe.esm.min.js');

    function initGallery(selector) {
        const lightbox = new PhotoSwipeLightbox({ gallery: selector, children: 'img', pswpModule });
        lightbox.addFilter('domItemData', (itemData, element) => {
            itemData.src = element.currentSrc || element.src;
            itemData.width = element.naturalWidth || 1600;
            itemData.height = element.naturalHeight || 1067;
            itemData.msrc = element.currentSrc || element.src;
            itemData.element = element;
            return itemData;
        });
        lightbox.init();
    }

    initGallery('#gallery');
    initGallery('#map-gallery');
</script>
</body>
</html>
